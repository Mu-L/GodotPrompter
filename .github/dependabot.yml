version: 2
updates:
  # Workflow actions are pinned to commit SHAs; Dependabot keeps the SHA and its
  # version comment current. Minor and patch updates arrive as one grouped PR a month.
  # Major updates stay separate: release.yml runs only on a tag, so a major bump there
  # can't be tested before a release and shouldn't hold up the rest.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
