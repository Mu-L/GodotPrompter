name: Plugin Security Scan

# HOL plugin-scanner (https://github.com/hashgraph-online/hol-guard) — the scan the
# awesome-ai-plugins listing runs. Fails below score 80 or on any high/critical finding.
# It flags risky sandbox/approval setting values in any .md/.json/.toml/.yml file, even
# inside comments; the patterns are RISKY_APPROVAL_PATTERNS in hol-guard's checks/security.py.

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashgraph-online/ai-plugin-scanner-action@caba2e96aa8ad2feb6cf6fca52442b52e22e779f # v1.2.635
        with:
          plugin_dir: "."
          min_score: 80
          fail_on_severity: high
          pr_comment: "off"
